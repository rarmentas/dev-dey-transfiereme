stages:
  - validate
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  POSTGRES_DB: cody_ci
  POSTGRES_USER: cody
  POSTGRES_PASSWORD: cody_ci_password
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  DJANGO_SECRET_KEY: ci-only-not-for-production
  DEBUG: "True"
  ALLOWED_HOSTS: localhost,127.0.0.1

.workflow_rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

.backend_before:
  before_script:
    - cd backend
    - python -m venv .venv
    - .venv/bin/pip install --upgrade pip
    - .venv/bin/pip install -r requirements.txt

backend:check:
  stage: validate
  image: python:3.12
  tags:
    - docker
  extends:
    - .workflow_rules
    - .backend_before
  cache:
    key:
      files:
        - backend/requirements.txt
    paths:
      - .cache/pip
  script:
    - .venv/bin/python manage.py check

backend:test:
  stage: test
  image: python:3.12
  tags:
    - docker
  extends:
    - .workflow_rules
    - .backend_before
  services:
    - name: postgres:17
      alias: postgres
  variables:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
  cache:
    key:
      files:
        - backend/requirements.txt
    paths:
      - .cache/pip
  script:
    - .venv/bin/python manage.py migrate --noinput
    - .venv/bin/python manage.py test config.tests
  needs:
    - backend:check

frontend:analyze:
  stage: validate
  image: ghcr.io/gmeligio/flutter-web:3.47.8
  tags:
    - docker
  extends: .workflow_rules
  cache:
    key:
      files:
        - frontend/pubspec.lock
    paths:
      - frontend/.dart_tool
      - frontend/.pub-cache
  script:
    - cd frontend
    - flutter pub get
    - flutter analyze

frontend:test:
  stage: test
  image: ghcr.io/gmeligio/flutter-web:3.47.8
  tags:
    - docker
  extends: .workflow_rules
  cache:
    key:
      files:
        - frontend/pubspec.lock
    paths:
      - frontend/.dart_tool
      - frontend/.pub-cache
  script:
    - cd frontend
    - flutter pub get
    - flutter test test/widget_smoke_test.dart
  needs:
    - frontend:analyze
