# CI de Cody (Django + Flutter web).
#
# Ramas:
#   test   → entorno test
#   master → producción (https://transfiereme.asware.com.mx)
#
# El runner docker solo acepta refs protegidas. Este workflow no crea
# pipeline de merge request: solo un push o un lanzamiento manual en
# master o en test. El merge a esas ramas dispara el push.
#
# Variables GitLab (protegidas, alcance production en master y test en la rama test):
#
# Test (prefijo TEST_):
#   TEST_SSH_PRIVATE_KEY (base64), TEST_DEPLOY_HOST, TEST_DEPLOY_USER,
#   TEST_DEPLOY_PORT, TEST_DEPLOY_PATH, TEST_ENV_FILE (File)
# Opcional: TEST_PYTHON (/opt/uv-python/cpython-3.12.14-linux-x86_64-gnu/bin/python3.12)
#
# Prod (prefijo PROD_):
#   PROD_SSH_PRIVATE_KEY (base64), PROD_DEPLOY_HOST, PROD_DEPLOY_USER,
#   PROD_DEPLOY_PORT, PROD_DEPLOY_PATH, PROD_ENV_FILE (File)
# Opcional: PROD_PYTHON (/opt/uv-python/cpython-3.12.14-linux-x86_64-gnu/bin/python3.12)

stages:
  - validate
  - test
  - build
  - deploy

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "test" && $CI_PIPELINE_SOURCE =~ /^(push|web)$/
    - if: $CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE =~ /^(push|web)$/

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  POSTGRES_DB: cody_ci
  POSTGRES_USER: cody
  POSTGRES_PASSWORD: cody_ci_password
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  DJANGO_SECRET_KEY: ci-only-not-for-production
  DEBUG: "True"
  ALLOWED_HOSTS: localhost,127.0.0.1

# Contraseña solo del Postgres efímero de backend:test. No es PROD ni TEST.

.env_ci:
  stage: validate
  image: python:3.12
  tags:
    - docker
  script:
    - bash scripts/ci-install-env.sh "$CODY_ENV_SCOPE"

env:comprobar:test:
  extends: .env_ci
  environment:
    name: test
    action: prepare
  variables:
    CODY_ENV_SCOPE: test
  rules:
    - if: $CI_COMMIT_BRANCH == "test"

env:comprobar:prod:
  extends: .env_ci
  environment:
    name: production
    action: prepare
  variables:
    CODY_ENV_SCOPE: prod
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

.backend_before:
  before_script:
    - cd backend
    - python -m venv .venv
    - .venv/bin/pip install --upgrade pip
    - .venv/bin/pip install -r requirements.txt

backend:check:
  stage: validate
  image: python:3.12
  tags:
    - docker
  extends: .backend_before
  cache:
    key:
      files:
        - backend/requirements.txt
    paths:
      - .cache/pip
  script:
    - .venv/bin/python manage.py check

backend:test:
  stage: test
  image: python:3.12
  tags:
    - docker
  extends: .backend_before
  services:
    - name: postgres:17
      alias: postgres
  variables:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
  cache:
    key:
      files:
        - backend/requirements.txt
    paths:
      - .cache/pip
  script:
    - .venv/bin/python manage.py migrate --noinput
    - .venv/bin/python manage.py test config.tests ambito.tests sesion.tests movimientos.tests
  needs:
    - backend:check

frontend:analyze:
  stage: validate
  image: ghcr.io/gmeligio/flutter-web:3.47.8
  tags:
    - docker
  cache:
    key:
      files:
        - frontend/pubspec.lock
    paths:
      - frontend/.dart_tool
      - frontend/.pub-cache
  script:
    - cd frontend
    - flutter pub get
    - flutter analyze

frontend:test:
  stage: test
  image: ghcr.io/gmeligio/flutter-web:3.47.8
  tags:
    - docker
  cache:
    key:
      files:
        - frontend/pubspec.lock
    paths:
      - frontend/.dart_tool
      - frontend/.pub-cache
  script:
    - cd frontend
    - flutter pub get
    - flutter test test/widget_smoke_test.dart
  needs:
    - frontend:analyze

.build_web_template:
  stage: build
  image: ghcr.io/gmeligio/flutter-web:3.47.8
  tags:
    - docker
  script:
    - cd frontend
    - flutter pub get
    - flutter build web --release
  artifacts:
    paths:
      - frontend/build/web/
    expire_in: 1 day
  needs:
    - frontend:test

build:web:test:
  extends: .build_web_template
  cache:
    key: flutter-test
    paths:
      - frontend/.dart_tool
      - frontend/.pub-cache
  rules:
    - if: $CI_COMMIT_BRANCH == "test"

build:web:prod:
  extends: .build_web_template
  cache:
    key: flutter-prod
    paths:
      - frontend/.dart_tool
      - frontend/.pub-cache
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

.deploy_template:
  stage: deploy
  image: alpine:3.22
  tags:
    - docker
  before_script:
    - apk add --no-cache bash openssh-client rsync
  script:
    - bash scripts/ci/deploy.sh "$DEPLOY_SCOPE"

deploy:test:
  extends: .deploy_template
  environment:
    name: test
  resource_group: test
  variables:
    DEPLOY_SCOPE: test
  needs:
    - job: backend:test
    - job: frontend:test
    - job: env:comprobar:test
    - job: build:web:test
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "test"

deploy:prod:
  extends: .deploy_template
  environment:
    name: production
    url: https://transfiereme.asware.com.mx
  resource_group: production
  variables:
    DEPLOY_SCOPE: prod
  needs:
    - job: backend:test
    - job: frontend:test
    - job: env:comprobar:prod
    - job: build:web:prod
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
