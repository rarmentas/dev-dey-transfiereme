services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cody}
      POSTGRES_USER: ${POSTGRES_USER:-cody}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cody_local_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - cody_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cody} -d ${POSTGRES_DB:-cody}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cody_pgdata:
