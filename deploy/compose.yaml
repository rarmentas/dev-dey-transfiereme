# Postgres de Cody en el VPS. Lo levanta scripts/ci/deploy-remoto.sh.
# El puerto 5435 es el de este servicio: 5432 es el del sistema,
# 5433 es denti-demo y 5434 es denti-prod.
# Uso: docker compose --env-file backend/.env -f deploy/compose.yaml up -d --wait

name: codi

services:
  postgres:
    image: postgres:17
    container_name: codi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requerido}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requerido}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - /var/lib/codi/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
  waha:
    image: ${WAHA_IMAGE:?WAHA_IMAGE requerido (imagen con digest probado, no latest)}
    container_name: codi-waha
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:?WAHA_API_KEY requerido}
      WHATSAPP_HOOK_URL: ${WEBHOOK_BASE_URL:?WEBHOOK_BASE_URL requerido}/api/webhooks/waha/
      WHATSAPP_HOOK_EVENTS: message
      WHATSAPP_HOOK_HMAC_KEY: ${WAHA_WEBHOOK_SECRET:?WAHA_WEBHOOK_SECRET requerido}
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /var/lib/codi/waha:/app/.sessions
